# Local backends for quicksql: integration tests, stress data, manual poking.
#
#   docker compose up -d --wait
#
# Postgres — three databases on one server (created on first boot of an empty
# volume):
#   quicksql        — long-lived data: stress seeds, manual TUI sessions
#   quicksql_test   — pytest's sandbox (tests create/drop their own tables)
#   quicksql_claims — synthetic healthcare claims for smoke tests
#                 (seed per examples/claims_seed.sql)
# The named volume keeps seeded data across `docker compose down` and reboots.
#
# bigquery-emulator — goccy's BigQuery API emulator (REST on :9050), project
# `quicksql-test`; drives the bigquery-marked tests without a GCP account:
#   uv run --extra bigquery pytest -m bigquery
# Point a cell at it with `input: { bigquery: { project: quicksql-test,
# endpoint: http://localhost:9050 } }`. State is in-memory: gone on restart,
# tests reseed what they need. Known quirk: duplicate creates answer 500 (not
# 409), so seed with probe-then-create, never create(exists_ok=True).

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quicksql
      POSTGRES_PASSWORD: quicksql
      POSTGRES_DB: quicksql
    volumes:
      - quicksql-pg:/var/lib/postgresql/data
      - ./docker/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 is load-bearing: on a fresh volume the entrypoint runs the
      # init scripts against a temporary socket-only server, so a plain
      # pg_isready reports ready before the real (TCP) server is listening and
      # `up -d --wait` returns too early.
      test: ["CMD-SHELL", "pg_isready -U quicksql -d quicksql -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s

  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    command: ["--project=quicksql-test"]
    ports:
      - "9050:9050"

volumes:
  quicksql-pg:
