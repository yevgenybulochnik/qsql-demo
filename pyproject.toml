[project]
name = "qsql-demo"
version = "0.1.0"
description = "A notebook-like CLI for SQL: named cell blocks with comment-driven, pluggable config."
readme = "README.md"
authors = [
    { name = "Yevgeny Bulochnik", email = "yevgeny.bulochnik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "jinja2>=3",
    "pyyaml>=6",
    "duckdb>=1.1",
    "polars>=1",
    "typer>=0.12",
    "rich>=13",
    "watchfiles>=0.21",
    "textual>=0.60",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery", "pyarrow", "db-dtypes"]
postgres = ["psycopg[binary]"]
visidata = ["visidata"]

[project.scripts]
qsql = "qsql_demo.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "openpyxl>=3",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not (network or bigquery or postgres)'"
markers = [
    "network: test hits the network (e.g. installs a DuckDB extension); deselected by default",
    "bigquery: test needs BigQuery credentials; deselected by default",
    "postgres: test needs a running Postgres; deselected by default",
]
