[project]
name = "qsql-demo"
version = "0.1.0"
description = "qsql — a CLI notebook for SQL, driven by comment directives"
readme = "README.md"
authors = [
    { name = "Yevgeny Bulochnik", email = "yevgeny.bulochnik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "polars>=1.0",
    "typer>=0.12",
    "watchfiles>=0.24",
    "textual>=0.80",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3", "pyarrow>=15", "db-dtypes"]
postgres = ["psycopg[binary]>=3"]
visidata = ["visidata>=3"]

[project.scripts]
qsql = "qsql_demo.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m \"not (network or bigquery or postgres)\""
markers = [
    "network: needs network access (deselected by default)",
    "bigquery: needs BigQuery credentials (deselected by default)",
    "postgres: needs a Postgres server (deselected by default)",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
