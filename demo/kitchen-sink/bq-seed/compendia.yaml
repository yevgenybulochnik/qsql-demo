# Drug compendia reference data for the kitchen-sink demo, loaded into the
# goccy bigquery-emulator at startup via --data-from-yaml (see
# docker-compose.yml). State is in-memory: every restart reseeds from here.
#
# The 10 NDCs and drug names match claims.pharmacy_claims in the Postgres seed
# (pg-init/10-claims-core.sql) verbatim, so cross-engine joins on ndc hit.
projects:
  - id: quicksql-test
    datasets:
      - id: compendia
        tables:
          - id: ndc_directory
            columns:
              - name: ndc
                type: STRING
              - name: drug_name
                type: STRING
              - name: generic_name
                type: STRING
              - name: strength
                type: STRING
              - name: dosage_form
                type: STRING
              - name: route
                type: STRING
              - name: brand_generic
                type: STRING
              - name: labeler_name
                type: STRING
              - name: therapeutic_class_code
                type: STRING
            data:
              - ndc: "00093104801"
                drug_name: "METFORMIN HCL 500MG TAB"
                generic_name: "metformin hydrochloride"
                strength: "500 mg"
                dosage_form: "tablet"
                route: "oral"
                brand_generic: "G"
                labeler_name: "TEVA PHARMACEUTICALS USA"
                therapeutic_class_code: "BIGU"
              - ndc: "00071015523"
                drug_name: "ATORVASTATIN 20MG TAB"
                generic_name: "atorvastatin calcium"
