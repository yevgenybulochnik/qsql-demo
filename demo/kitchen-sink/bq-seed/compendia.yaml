          - id: therapeutic_classes
            columns:
              - name: class_code
                type: STRING
              - name: class_name
                type: STRING
              - name: description
                type: STRING
            data:
              - class_code: "BIGU"
                class_name: "Biguanides"
                description: "Oral antihyperglycemics that decrease hepatic glucose production"
              - class_code: "STAT"
                class_name: "HMG-CoA Reductase Inhibitors"
