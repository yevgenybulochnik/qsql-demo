# Standalone backends for the kitchen-sink demo:
#
#   docker compose -f demo/kitchen-sink/docker-compose.yml up -d --wait
#
# Uses the SAME ports (5432, 9050) as the repo-root compose stack — the two
# are mutually exclusive. `docker compose down` at the repo root first.
#
# postgres — single database `quicksql_claims`, seeded on first boot of an
# empty volume by ./pg-init (claims core tables + the 250-column
# claims.claims_837_wide extract). The named volume keeps the seed across
# `down`; `down -v` to force a reseed.
#
# bigquery-emulator — goccy's BigQuery API emulator (REST on :9050), project
# `quicksql-test`, seeded from ./bq-seed/compendia.yaml at startup. State is
# in-memory: every restart reseeds identically from the YAML. Point a cell at
# it with `input: { bigquery: { project: quicksql-test, endpoint:
# http://localhost:9050 } }`.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quicksql
      POSTGRES_PASSWORD: quicksql
      POSTGRES_DB: quicksql_claims
    volumes:
      - kitchen-sink-pg:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 is load-bearing: on a fresh volume the entrypoint runs the
      # init scripts against a temporary socket-only server, so a plain
      # pg_isready reports ready before the real (TCP) server is listening and
      # `up -d --wait` returns too early.
      test: ["CMD-SHELL", "pg_isready -U quicksql -d quicksql_claims -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s

  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    command: ["--project=quicksql-test", "--data-from-yaml=/seed/compendia.yaml"]
    ports:
      - "9050:9050"
    volumes:
      - ./bq-seed/compendia.yaml:/seed/compendia.yaml:ro

volumes:
  kitchen-sink-pg:
